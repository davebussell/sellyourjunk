# Netlify configuration for We Pay for Junk
# Static prototype — no build step. Files are served from the repo root.

[build]
  publish = "."
  command = ""

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# CSS/JS change often in this prototype — revalidate each load (cheap 304
# via ETag) so updates go live immediately instead of being cached for a day.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Belt and braces: the strategy docs are gitignored and excluded from
# deploys, but if one ever gets uploaded it must still 404 rather than
# serve. Netlify splats only work at the end of a path (/*.md never
# matched), so each doc gets an explicit forced rule — force = true is
# what makes a rule shadow a real uploaded file.
[[redirects]]
  from = "/SellYourJunk-Commercial-Plan-v1.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/SellYourJunk-Marketplace-Plan-v3.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/SellYourJunk-Mission-Plan.md"
  to = "/index.html"
  status = 404
  force = true

# Same for local tooling that shouldn't be public.
[[redirects]]
  from = "/build-preview.py"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/WePayForJunk-preview.html"
  to = "/index.html"
  status = 404
  force = true
